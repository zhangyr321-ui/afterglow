<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3ecdf" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="余温 · 一本每天只写一页的日记，留给你和替你记得的人。" />
    <title>余温 · Afterglow</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f3ecdf'/%3E%3Crect x='4' y='3' width='8' height='10' fill='%232a251f'/%3E%3Crect x='5' y='4' width='6' height='8' fill='%23b3552e'/%3E%3Crect x='6' y='5' width='4' height='6' fill='%23f3ecdf'/%3E%3Crect x='3' y='13' width='10' height='1' fill='%232a251f'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <button class="brand" type="button" data-action="nav" data-view="today" aria-label="回到今天">
        <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="4" y="2" width="8" height="11" fill="currentColor" />
          <rect x="5" y="3" width="6" height="9" fill="#b3552e" />
          <rect x="6" y="4" width="4" height="7" fill="#f3ecdf" />
          <rect x="3" y="13" width="10" height="1" fill="currentColor" />
        </svg>
        <span class="brand-name">余温</span>
        <span class="brand-latin">AFTERGLOW</span>
      </button>

      <nav class="nav" aria-label="主导航">
        <button type="button" data-action="nav" data-view="today" data-nav="today">今天</button>
        <button type="button" data-action="nav" data-view="log" data-nav="log">册页</button>
        <button type="button" data-action="nav" data-view="calendar" data-nav="calendar">字历</button>
      </nav>

      <div class="topbar-tools">
        <button class="icon-btn" type="button" data-action="compose" aria-label="写一页" title="写一页">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M4 14.5V16h1.5l8.7-8.7-1.5-1.5L4 14.5Z" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path d="m12.2 5.3 1.1-1.1a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1 0 1.4l-1.1 1.1-2.5-2.5Z" fill="currentColor" />
          </svg>
        </button>
        <button class="icon-btn" type="button" data-action="settings" aria-label="设置" title="设置">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path
              d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="square"
            />
          </svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="page-foot">
      <span>一天一页 · 写完即封存</span>
      <span class="foot-dot">·</span>
      <span id="storage-note">只存在这台设备上</span>
    </footer>

    <div id="selection-pill" class="selection-pill" hidden></div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        function show(kind, message) {
          var view = document.getElementById("view");
          if (!view) return;
          var box = document.createElement("pre");
          box.id = "boot-error";
          box.style.cssText = "white-space:pre-wrap;padding:24px;border:1px solid #b3552e;background:#fbeee6;color:#7e3323;font:12px/1.7 monospace";
          box.textContent = kind + "\n" + String(message);
          view.replaceChildren(box);
        }
        window.addEventListener("error", function (event) {
          show("ERROR", event.message + (event.filename ? "\n" + event.filename + ":" + event.lineno : ""));
        });
        window.addEventListener("unhandledrejection", function (event) {
          show("REJECTION", (event.reason && (event.reason.stack || event.reason.message)) || event.reason);
        });
      })();
    </script>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
